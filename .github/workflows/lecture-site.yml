name: Lecture site checks

on:
  pull_request:
    paths: ["lecture-site/**", ".github/workflows/lecture-site.yml"]
  push:
    paths: ["lecture-site/**", ".github/workflows/lecture-site.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lecture-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lecture-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:lecture
      - run: npm run test:isolated
