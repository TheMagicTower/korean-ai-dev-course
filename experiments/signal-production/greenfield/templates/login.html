{% extends 'base.html' %}{% block content %}<section class="login"><div class="eyebrow">NEWSROOM ACCESS</div><h1>편집국 로그인</h1><p>운영자가 발급한 계정으로 접속하십시오.</p>{% if error %}<p class="notice" role="alert">{{error}}</p>{% endif %}<form method="post">{% csrf_token %}<label for="username">계정</label><input id="username" name="username" autocomplete="username" maxlength="150" required><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><button type="submit">로그인</button></form></section>{% endblock %}
